name: Build Subscriptions

on:
  # 手动触发（推荐：线路失效时手动跑一次）
  workflow_dispatch:
  # 每两周自动校验一次，剔除失效线路（不追求每日刷新）
  schedule:
    - cron: "0 18 1,15 * *"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 ffmpeg (提供 ffprobe)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 生成订阅
        run: python3 scripts/build.py --timeout 8 --workers 32

      - name: 提交更新
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add subscriptions/ scripts/data/
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: rebuild subscriptions $(date -u +%Y-%m-%d)"
            git push
          fi
